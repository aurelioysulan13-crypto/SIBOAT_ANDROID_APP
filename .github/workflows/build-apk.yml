name: Build SIBOAT Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build SIBOAT Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify Android project and SIBOAT launcher icon
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle
          test -f build.gradle
          test -f gradle.properties
          test -f app/build.gradle
          test -f app/proguard-rules.pro

          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/siboat/controller/MainActivity.java
          test -f app/src/main/assets/index.html

          test -f app/src/main/res/drawable/siboat_icon_foreground.png
          test -f app/src/main/res/drawable/siboat_icon_background.xml

          test -f app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -f app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

          test -f app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -f app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

          grep -q 'android:icon="@mipmap/ic_launcher"' \
            app/src/main/AndroidManifest.xml

          grep -q 'android:roundIcon="@mipmap/ic_launcher_round"' \
            app/src/main/AndroidManifest.xml

          echo "SIBOAT project structure, dashboard, and launcher resources verified."

      - name: Show Java and Gradle versions
        shell: bash
        run: |
          set -euo pipefail

          java -version

          echo

          gradle --version

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            clean \
            assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          ls -lh "$APK"

          echo "SIBOAT Android APK build succeeded."

      - name: Upload SIBOAT APK
        uses: actions/upload-artifact@v4
        with:
          name: SIBOAT-Android-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 0
