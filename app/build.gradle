plugins {
    id 'com.android.application'
}

android {
    namespace 'com.siboat.controller'
    compileSdk 35
    defaultConfig { applicationId 'com.siboat.controller'; minSdk 23; targetSdk 35; versionCode 2; versionName '1.1.0' }
    buildTypes {
        release { minifyEnabled false; shrinkResources false; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' }
        debug { minifyEnabled false }
    }
}
configurations.all {
    resolutionStrategy.eachDependency { details -> if (details.requested.group == 'org.jetbrains.kotlin') { details.useVersion '1.8.22' } }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.15.0'
    implementation 'com.github.mik3y:usb-serial-for-android:3.11.0'
}
